[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragsource"
version = "0.1.0"
description = "Citation-first RAG assistant for PDF knowledge bases"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dareen Esleem" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5.1,<6",
  "fastembed>=0.7,<1",
  "numpy>=2.0,<3",
  "google-genai>=1.29,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragsource"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=ragsource --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
